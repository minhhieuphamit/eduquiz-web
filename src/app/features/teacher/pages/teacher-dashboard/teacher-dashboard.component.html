<div class="dashboard">
  <div class="dashboard-header">
    <h1 class="dashboard-title">Xin chào, {{ userName }}!</h1>
    <p class="dashboard-subtitle">Quản lý câu hỏi, đề thi và phòng thi của bạn.</p>
  </div>

  <div class="quick-actions">
    <h2 class="section-title">Thao tác nhanh</h2>
    <div class="actions-grid">
      <a routerLink="/teacher/questions" class="action-card">
        <div class="action-icon action-icon-blue">
          <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/><circle cx="12" cy="17" r=".5"/></svg>
        </div>
        <span>Quản lý câu hỏi</span>
      </a>
      <a routerLink="/teacher/exams" class="action-card">
        <div class="action-icon action-icon-orange">
          <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7Z"/><path d="M14 2v4a2 2 0 0 0 2 2h4"/><path d="M10 13h4"/><path d="M10 17h4"/></svg>
        </div>
        <span>Quản lý đề thi</span>
      </a>
      <a routerLink="/teacher/rooms" class="action-card">
        <div class="action-icon action-icon-green">
          <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><line x1="19" y1="8" x2="19" y2="14"/><line x1="22" y1="11" x2="16" y2="11"/></svg>
        </div>
        <span>Tạo phòng thi</span>
      </a>
    </div>
  </div>
</div>
